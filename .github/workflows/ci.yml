name: CI

on:
  push:
  pull_request:

# No deployment steps exist in this workflow. It only verifies the foundation:
# application checks, workflow-file linting, and local-infrastructure
# reachability.
permissions:
  contents: read

jobs:
  mobile:
    name: Mobile (React Native + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/go

    # PostgreSQL is declared so the identity store's integration tests run instead of
    # skipping. The image, credentials, and health check mirror the services-smoke job.
    #
    # The DSN reaches the service at 127.0.0.1:5432 — the published port — because a
    # job running directly on the runner is not on the service container's Docker
    # network, so the label `postgres` does not resolve. This is the same host and port
    # services-smoke already uses from its psql step.
    env:
      KNOT_POSTGRES_DSN: 'postgres://knot:knot_local_only_change_me@127.0.0.1:5432/knot?sslmode=disable'

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: knot
          POSTGRES_PASSWORD: knot_local_only_change_me
          POSTGRES_DB: knot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knot -d knot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Format check (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The store's integration tests need the users table to exist: without it they
      # skip rather than fail, which would leave the layer uncovered while the job
      # stayed green. This applies the existing migrations using the same subcommand
      # developers run locally, and it fails loudly if the database is unreachable.
      - name: Apply database migrations
        run: go run ./cmd/knot migrate up

      - name: Test
        run: go test ./...

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # actionlint is pinned to an exact version so workflow linting cannot
      # drift on its own. Bump deliberately in its own change.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint -color

  services-smoke:
    name: Services smoke (Postgres + Redis)
    runs-on: ubuntu-latest

    # Image versions are pinned to match infrastructure/docker/docker-compose.yml
    # exactly. This job proves REACHABILITY ONLY: no schema, no migrations, and
    # no product tables are created.
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: knot
          POSTGRES_PASSWORD: knot_local_only_change_me
          POSTGRES_DB: knot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knot -d knot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql and redis-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client redis-tools

      - name: Prove PostgreSQL reachability
        env:
          PGPASSWORD: knot_local_only_change_me
        run: |
          for attempt in $(seq 1 30); do
            if psql --host=127.0.0.1 --port=5432 --username=knot --dbname=knot --command='SELECT 1;'; then
              echo "PostgreSQL is reachable."
              exit 0
            fi
            echo "Attempt ${attempt}/30: PostgreSQL not ready yet."
            sleep 2
          done
          echo "PostgreSQL did not become reachable." >&2
          exit 1

      - name: Prove Redis reachability
        run: |
          for attempt in $(seq 1 30); do
            if redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG; then
              echo "Redis is reachable."
              exit 0
            fi
            echo "Attempt ${attempt}/30: Redis not ready yet."
            sleep 2
          done
          echo "Redis did not become reachable." >&2
          exit 1
