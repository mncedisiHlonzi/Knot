[package]
name = "knot-media-worker"
version = "0.1.0"
edition = "2021"
description = "Knot's media derivative worker: turns queued uploads into AVIF/WebP/video derivatives."
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
aws-config = { version = "1.13", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.157"
bytes = "1"
ffmpeg-sidecar = { version = "2.7", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "avif"] }
redis = { version = "1.8", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
webp = "0.3"
