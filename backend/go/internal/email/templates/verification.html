<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your Knot email address</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f5f5f7">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f5f5f7; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              background: #ffffff;
              border-radius: 16px;
              padding: 32px;
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            "
          >
            <tr>
              <td>
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 13px;
                    letter-spacing: 0.08em;
                    text-transform: uppercase;
                    font-weight: 700;
                    color: #5b35e8;
                  "
                >
                  Knot
                </p>
                <h1 style="margin: 0 0 16px; font-size: 26px; line-height: 32px; color: #0f172a">
                  Welcome to Knot.
                </h1>
                <p style="margin: 0 0 24px; font-size: 16px; line-height: 24px; color: #334155">
                  Click the link below to verify your email address.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{.DeepLink}}"
                    style="
                      display: inline-block;
                      padding: 14px 24px;
                      border-radius: 999px;
                      background: #5b35e8;
                      color: #ffffff;
                      font-size: 16px;
                      font-weight: 600;
                      text-decoration: none;
                    "
                    >Verify Email</a
                  >
                </p>
                <p style="margin: 0; font-size: 13px; line-height: 20px; color: #64748b">
                  This link expires in 24 hours.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
